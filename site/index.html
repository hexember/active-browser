<body>
<h1>ActiveBrowser</h1>
<p>A macOS menu bar app that opens every link in the browser you used most recently.</p>
<pre><code>curl -fsSL https://activebrowser.app/install.sh | sh</code></pre>
<p>Then choose <em>Set as Default Browser</em> from the menu bar icon.</p>
<p>Requirements: macOS 13+.</p>
<p><a href="https://github.com/hexember/active-browser">Source on GitHub</a> · <a href="https://github.com/hexember/active-browser/releases/latest">Latest release</a></p>
